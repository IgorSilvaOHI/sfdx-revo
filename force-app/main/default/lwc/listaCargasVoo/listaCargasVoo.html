<template>
  <div class="lista-cargas-voo">
    <div class="header">
      <h1 class="slds-text-heading_medium slds-text-align_center">
        {customLabel.cargasVoo}
      </h1>
      <template if:true={possuiCargasVoo}>
        <lightning-button
          class="nova-carga"
          variant="brand"
          label={customLabel.nova}
          icon-name="utility:add"
          icon-position="right"
          onclick={handleNovaCarga}
        >
        </lightning-button>
      </template>
    </div>
    <div class="lista">
      <template if:true={possuiCargasVoo}>
        <div class="carga-voo-item">
          <div class="header-item slds-text-heading_small ident-label">
            {customLabel.identificacao}
          </div>
          <div class="header-item slds-text-heading_small prof-label">
            {customLabel.profundidade}
          </div>
          <div class="header-item slds-text-heading_small larg-label">
            {customLabel.largura}
          </div>
          <div class="header-item slds-text-heading_small alt-label">
            {customLabel.altura}
          </div>
          <div class="header-item slds-text-heading_small peso-label">
            {customLabel.peso}
          </div>
          <div class="space-div"></div>
          <template for:each={cargasVoo} for:item="cargaVoo" for:index="index">
            <div key={cargaVoo.Id} class="item ident">{cargaVoo.Identificacao__c}</div>
            <div key={cargaVoo.Id} class="item prof">
              <lightning-formatted-number
                value={cargaVoo.Profundidade__c}
                maximum-fraction-digits="2"
              ></lightning-formatted-number>
            </div>
            <div key={cargaVoo.Id} class="item larg">
              <lightning-formatted-number
                value={cargaVoo.Largura__c}
                maximum-fraction-digits="2"
              ></lightning-formatted-number>
            </div>
            <div key={cargaVoo.Id} class="item alt">
              <lightning-formatted-number
                value={cargaVoo.Altura__c}
                maximum-fraction-digits="2"
              ></lightning-formatted-number>
            </div>
            <div key={cargaVoo.Id} class="item peso">
              <lightning-formatted-number
                value={cargaVoo.Peso__c}
                maximum-fraction-digits="2"
              ></lightning-formatted-number>
            </div>
            <div key={cargaVoo.Id} class="acoes">
              <lightning-button
                data-carga-id={cargaVoo.Id}
                variant="brand"
                label="Editar"
                icon-name="utility:edit"
                icon-position="right"
                onclick={handleEditCarga}
              >
              </lightning-button>
              <lightning-button
                data-carga-id={cargaVoo.Id}
                variant="destructive"
                label="Remover"
                icon-name="utility:delete"
                icon-position="right"
                onclick={handleDeleteCarga}
              >
              </lightning-button>
            </div>
          </template>
        </div>
      </template>
      <template if:false={possuiCargasVoo}>
        <div
          style="display: flex; align-items: center; justify-content: center; flex-flow: column; margin-top: 4rem;"
        >
          <p style="margin-bottom: 1rem;">
            {customLabel.vooNaoPossuiCarga}
          </p>
          <lightning-button
            variant="brand"
            label={customLabel.cadastrarNovaCarga}
            icon-name="utility:add"
            icon-position="right"
            onclick={handleNovaCarga}
          >
          </lightning-button>
        </div>
      </template>
    </div>
  </div>
</template>
