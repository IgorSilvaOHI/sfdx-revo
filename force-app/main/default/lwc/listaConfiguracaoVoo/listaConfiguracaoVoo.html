<template>
    <div class="slds-box slds-box-without-border slds-theme_default">
        <lightning-card class="slds-size_1-of-1">
            <div slot="title" class="slds-media slds-media_center slds-has-flexi-truncate slds-size_1-of-1 slds-p-horizontal_small slds-p-top_x-small">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="custom:custom72" alternative-text="Produto" title="Produto" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h3 class="slds-card__header-title">
                        <span>Voos ({getVoosLength})</span>
                    </h3>
                </div>
            </div>
            <div slot="actions" class=" slds-p-horizontal_small slds-p-top_x-small">
                <template if:true={displayAdicionarVoo}>
                    <lightning-button label="Adicionar" title="Adicionar novo voo à oportunidade" onclick={handleAdicionarVoo}></lightning-button>
                    <!-- Novo -->
                    <!-- <lightning-button class="slds-m-left_small" variant="brand" label="Gerar Voos Retroativos" title="Abrir flow de geração retroativa" onclick={handleAbrirFlowRetro}></lightning-button> -->
                    <!-- Novo -->
                </template>
            </div>
            <template if:false={isGridLoadedEmpty}>
                <div class="slds-grid slds-wrap slds-grid-fix-radius slds-p-bottom_large">
                    <div class="slds-size_1-of-1 slds-is-relative">
                        <lightning-datatable
                            key-field="id"
                            data={opportunity.opportunityLineItems}
                            columns={datagridOpportunityLineItemColumns}
                            onrowaction={handleRowAction}
                            hide-checkbox-column="true"
                            show-row-number-column>
                        </lightning-datatable>
                        <template if:true={gridLoading}>
                            <div class="slds-spinner_container">
                                <lightning-spinner variant="brand" alternative-text="Loading...">
                                </lightning-spinner>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </lightning-card>
    </div>
</template>
