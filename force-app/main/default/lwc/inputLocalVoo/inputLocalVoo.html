<template>
    <div class="slds-grid">
        <div class={getColumnClass}>
            <template if:true={isCoordenada}>
                <c-lookup-action object-api-name="LocalOportunidade__c" 
                                    field-api-name="Coordenadas__c"
                                    required="true" 
                                    label={label}
                                    onchangevalue={handleChangeValue}
                                    onformatvalue={handleFormatValue}
                                    record-id={coordenadeValue}>
                </c-lookup-action>
            </template>
            <template if:true={isLocal}>
                <c-lookup-action object-api-name="OpportunityLineItem" 
                                 field-api-name="Origem__c"
                                 required="true"
                                 label={label}
                                 onchangevalue={handleChangeValue}
                                 onformatvalue={handleFormatValue}
                                 record-id={locationValue}>
                </c-lookup-action>
            </template>
        </div>
        <template if:true={displayBotaoCoordenada}>   
            <div class="slds-size_2-of-5 slds-p-around_small slds-align-bottom">
                    <lightning-input type="toggle" label="Coordenadas?" 
                                name="coordenadas" onchange={handleChange}
                                checked={coordenadasSelecionado}>
                    </lightning-input>
            </div>
        </template>
    </div>
</template>
