<template >
    
    <template lwc:if={voo.disponivel}>
        <div class="slds-box slds-grid slds-grid_vertical slds-grid_vertical-stretch card-withoutborder-aeronave card-voo slds-p-around_small" style="background-color: #fff !important;" data-column-key={voo.mainCode}>
            <div class="slds-grid slds-wrap ">
                <div class="slds-size_1-of-1 slds-p-around_small">
                    <div class="slds-grid">
                        <div class="slds-grid slds-wrap">
                            <template lwc:if={hasTranslado}>
                                <div class="slds-size_1-of-1 " title="Duração">
                                    <lightning-icon icon-name="utility:clock" size="x-small" alternative-text="Duração" >
                                    </lightning-icon>
                                    <span class="slds-m-left_xx-small">
                                        {tempoTranslado}
                                    </span>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="slds-size_1-of-1 " title="Duração total">
                                    <lightning-icon icon-name="utility:real_time" size="x-small" alternative-text="Duração" >
                                    </lightning-icon>
                                    <span class="slds-m-left_xx-small">
                                        {tempoVoo}
                                    </span>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col_bump-left slds-grid" title="Assentos disponíveis">
                            <div class="slds-m-right_xx-small">
                                <c-custom-icons fill="#056764"></c-custom-icons>
                            </div>
                            <div class="" >
                                <span class="slds-text-heading_small slds-text-color_success">
                                    {voo.assentosDisponiveis}
                                </span>
                            </div>
                        </div>
                    </div>
                    <template if:false={hasTranslado}>
                        <div class="slds-size_1-of-1 slds-p-top_small">
                            <div class="slds-text-heading_medium slds-text-align_right">
                                <lightning-formatted-number value={voo.precoUnitarioComServico} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                                <template lwc:if={voo.isCharter}> 
                                    <span class="slds-text-heading_small">/h</span>
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <template if:true={hasTranslado}>
                        <div class="slds-size_1-of-1 slds-p-top_small"></div>
                    </template>
                    <div class="slds-grid slds-size_1-of-1 slds-p-top_xx-small slds-text-align_right">
                        <span class="slds-col_bump-left slds-p-right_xx-small">
                            Total:
                        </span>
                        <div class="slds-grid slds-text-heading_small">
                            <lightning-formatted-number value={voo.precoFinalComServico} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                        </div>
                    </div>
                    <template lwc:if={voo.invalido}>
                        <lightning-icon icon-name="utility:error" alternative-text="Error!" title="Error"></lightning-icon>
                    </template>
                    <template lwc:else>
                        <div class="slds-p-top_xx-small">
                            <lightning-button variant={getSelectButtonVariant} stretch label="Selecionar" onclick={handleSelecionar} ></lightning-button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-box slds-grid slds-grid_vertical slds-grid_vertical-stretch card-withoutborder-aeronave card-voo slds-p-around_small" style="background-color:#fff !important;" >
            <div class="slds-align_absolute-center" >
                <span class="slds-text-heading_small slds-align_absolute-center">
                    <lightning-icon icon-name="utility:error" alternative-text="Indisponível" title="Indisponível"></lightning-icon>
                </span>
            </div>
        </div>
    </template>
</template>
